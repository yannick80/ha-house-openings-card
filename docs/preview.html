<!doctype html>
<!-- Renders the README preview images: the real card from dist/ with mocked
     ha-card / ha-icon and a mocked hass object. Not Home Assistant itself.

     Parameters:  ?lang=en|de

     Regenerate the images from the repo root:  sh docs/render-previews.sh -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: Roboto, -apple-system, "Segoe UI", sans-serif; display: flex; }
  .theme { flex: none; padding: 16px; }
  .theme h3 { margin: 0 4px 8px; font-size: 13px; font-weight: 400; color: var(--secondary-text-color); }
  .theme house-openings-card { display: block; margin-bottom: 16px; }
  .wide { width: 500px; }
  .phone { width: 340px; }
  .light {
    background: #f2f2f2; --card-background-color: #fff; --ha-card-border-color: #e0e0e0;
    --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: #e0e0e0;
  }
  .dark {
    background: #111; --card-background-color: #1c1c1c; --ha-card-border-color: #2c2c2c;
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: #2c2c2c;
  }
  .theme { --success-color: #43a047; --warning-color: #ffa600; --error-color: #db4437; --info-color: #039be5; }
</style>
</head>
<body>
<script type="module">
  import * as mdi from "https://cdn.jsdelivr.net/npm/@mdi/js@7.4.47/mdi.js";
  const toKey = (name) => "mdi" + name.replace("mdi:", "").split("-").map((p) => p[0].toUpperCase() + p.slice(1)).join("");

  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        `<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--ha-card-border-color);border-radius:12px}</style><slot></slot>`;
    }
  });
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    attributeChangedCallback() {
      this.style.display = "inline-flex";
      const s = "var(--mdc-icon-size, 24px)";
      this.innerHTML = `<svg viewBox="0 0 24 24" style="width:${s};height:${s};display:block;fill:currentColor"><path d="${mdi[toKey(this.getAttribute("icon"))] || ""}"/></svg>`;
    }
  });

  await import("../dist/house-openings-card.js");

  const lang = new URLSearchParams(location.search).get("lang") === "de" ? "de" : "en";
  const L = {
    de: { bad: "Bad", kinder: "Kinderzimmer", schlafen: "Schlafzimmer", wohnen: "Wohnzimmer", kueche: "Küche", flur: "Flur",
      garage: "Garage", einfahrt: "Einfahrt", window: "Fenster", left: "Fenster links", right: "Fenster rechts", terrace: "Terrassentür", front: "Haustür",
      garage_door: "Garagentor", carport: "Carport" },
    en: { bad: "Bathroom", kinder: "Kids' room", schlafen: "Bedroom", wohnen: "Living room", kueche: "Kitchen", flur: "Hallway",
      garage: "Garage", einfahrt: "Driveway", window: "Window", left: "Window left", right: "Window right", terrace: "Patio door", front: "Front door",
      garage_door: "Garage door", carport: "Carport" },
  }[lang];

  // items: [id, area, state, attrs, minutes]
  function hass(items) {
    const h = { locale: { language: lang }, language: lang, areas: {}, devices: {}, entities: {}, states: {} };
    for (const a of ["bad", "kinder", "schlafen", "wohnen", "kueche", "flur", "garage", "einfahrt"]) h.areas[a] = { area_id: a, name: L[a] };
    for (const [id, area, state, attributes, minutes] of items) {
      h.devices["d_" + id] = { id: "d_" + id, area_id: area };
      h.entities[id] = { entity_id: id, device_id: "d_" + id };
      h.states[id] = { entity_id: id, state, attributes, last_changed: new Date(Date.now() - (minutes || 0) * 60000).toISOString() };
    }
    return h;
  }
  const w = (id, area, state, name, minutes, extra) =>
    [`binary_sensor.${id}`, area, state, { device_class: "window", friendly_name: `${L[area]} ${name}`, ...(extra || {}) }, minutes];
  const gates = (gState, gPos, gMin, cState, cMin) => [
    ["cover.garagentor", "garage", gState, { device_class: "garage", current_position: gPos, friendly_name: L.garage_door }, gMin],
    ["cover.carport", "einfahrt", cState, { device_class: "gate", friendly_name: L.carport }, cMin],
  ];

  const BUSY = hass([
    w("bad", "bad", "on", L.window, 52),
    w("kinder_l", "kinder", "on", L.left, 14, { window_state: "TILTED" }),
    w("kinder_r", "kinder", "off", L.right, 300),
    w("schlafen", "schlafen", "on", L.window, 6),
    w("wohnen", "wohnen", "off", L.terrace, 90),
    w("kueche", "kueche", "off", L.window, 400),
    ["binary_sensor.haustuer", "flur", "off", { device_class: "door", friendly_name: `${L.flur} ${L.front}` }, 30],
    ...gates("open", 35, 8, "closed", 600),
  ]);
  const CALM = hass([
    w("bad", "bad", "off", L.window, 52),
    w("kinder_l", "kinder", "off", L.left, 14),
    w("schlafen", "schlafen", "off", L.window, 6),
    w("wohnen", "wohnen", "off", L.terrace, 90),
    ...gates("closed", 0, 300, "open", 75),
  ]);

  for (const theme of ["light", "dark"]) {
    const col = document.createElement("div");
    col.className = `theme ${theme}`;
    document.body.appendChild(col);
    for (const [label, h, width] of [["section width", BUSY, "wide"], ["phone width", CALM, "phone"]]) {
      const head = document.createElement("h3");
      head.textContent = label;
      const card = document.createElement("house-openings-card");
      card.className = width;
      card.setConfig({});
      card.hass = h;
      col.append(head, card);
    }
  }
</script>
</body>
</html>
